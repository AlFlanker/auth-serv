# =============================================================================
# Тестовый профиль: H2 in-memory
# =============================================================================
spring:
  datasource:
    # H2 использует отдельный тайм-аут ожидания блокировки строки.
    url: jdbc:h2:mem:identity;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;LOCK_TIMEOUT=2000;INIT=CREATE ALIAS IF NOT EXISTS CLOCK_TIMESTAMP FOR 'java.time.Instant.now()'
    username: sa
    password:
    driver-class-name: org.h2.Driver

etcd:
  startup:
    verify-connection: false

config:
  source:
    cache:
      enabled: false

logging:
  level:
    com.otr.portal: INFO

identity:
  token:
    keys:
      ephemeral: true
