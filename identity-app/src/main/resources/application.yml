# =============================================================================
# Основные настройки сервера
# =============================================================================
server:
  port: 8091

# =============================================================================
# Настройки Spring Boot
# =============================================================================
spring:
  application:
    name: identity-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/identity
    username: identity
    password: identity
    hikari:
      maximum-pool-size: 10

# =============================================================================
# Management / Actuator
# =============================================================================
management:
  otlp:
    metrics:
      export:
        enabled: false
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4317}
          transport: grpc
  tracing:
    export:
      otlp:
        enabled: false
    sampling:
      probability: 0.1
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,ssoConfiguration

# =============================================================================
# Логирование
# =============================================================================
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  level:
    com.otr.portal: INFO
    com.otr.portal.etcd.ReactiveEtcdClient: TRACE
    com.otr.portal.config.source.etcd.EtcdConfigSource: TRACE
    com.otr.portal.config.source.cache.CachingConfigSource: TRACE

# =============================================================================
# identity-service: внутренний API и USS
# =============================================================================
identity:
  internal:
    require-api-key: ${IDENTITY_INTERNAL_REQUIRE_API_KEY:true}
    api-key: ${IDENTITY_INTERNAL_API_KEY:}                # При обязательной проверке пустой ключ закрывает доступ
  token:
    ttl: 30m                                             # Время жизни access-токена
    issuer: https://identity-service                     # iss (URL-форма)
    key-id: identity-1                                   # Уникальный kid активного ключа
    audiences: [portal-edge]
    clock-skew: 30s
    max-session-lifetime: 8h
    jwks-cache-ttl: 5m
    keys:
      ephemeral: false                                   # Для запуска укажите путь keys.private-key
  auth:
    local-password-enabled: false
    sso-cookie-enabled: false

admin:
  security:
    usb:                                                 # Аналог UsbProperties монолита (application.yml)
      application-code: ETD_PORTAL
      resource-type-code: ETD_ROLE
      operation-code: ACCESS

# =============================================================================
# Конфигурация ConfigSource — чтение конфигов из ETCD с кэшированием
# =============================================================================
config:
  source:
    etcd:
      key-prefix: "fk-portal/"                             # Префикс ключей внутри ETCD (аналог appName + "/")
      timeout: 10s                                          # Таймаут одной операции чтения из ETCD
      watch-require-leader: true                            # Требовать лидера кластера для watch
    cache:
      enabled: true                                         # Включить кэширование поверх ConfigSource
      watch-prefix: ""                                      # Логический префикс ключей для сброса кэша (пусто = весь диапазон)
      maximum-size: 10000                                   # Максимальное количество записей в кэше
      expire-after-write: 10m                               # Время жизни записи в кэше
      watch-retry-backoff: 5s                               # Начальная задержка переподключения watch
      watch-retry-max-backoff: 1m                           # Максимальная задержка переподключения watch

# =============================================================================
# Настройки ETCD-клиента (jetcd)
# =============================================================================
etcd:
  endpoints:                                                # Адреса нод ETCD (схема + хост + порт)
    - http://localhost:2379
  # user:                                                   # Имя пользователя RBAC
  # password:                                               # Пароль RBAC
  # namespace:                                              # Namespace для всех ключей клиента
  # authority:                                              # gRPC authority (SNI/Host)
  # load-balancer-policy:                                   # Политика балансировки: round_robin | pick_first
  # connect-timeout:                                        # Таймаут установки соединения
  # keep-alive-time:                                        # Период keep-alive ping
  # keep-alive-timeout:                                     # Таймаут ответа на keep-alive ping
  # keep-alive-without-calls:                               # Отправлять keep-alive при отсутствии активных вызовов
  # wait-for-ready:                                         # Ждать готовности канала вместо немедленной ошибки
  # max-inbound-message-size:                               # Максимальный размер входящего gRPC-сообщения (байт)
  startup:
    verify-connection: false                                # Проверять доступность ETCD при старте
    retry-attempts: 3                                       # Количество попыток проверки при старте
    retry-backoff: 5s                                       # Начальная задержка между попытками
    retry-max-backoff: 10s                                  # Максимальная задержка между попытками
    timeout: 5s                                             # Таймаут одной попытки проверки
